<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background-color: #2E7D32;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        .alert {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <form onsubmit="login(event)">
            <input type="text" id="username" class="form-control" placeholder="Username" required><br>
            <input type="password" id="password" class="form-control" placeholder="Password" required><br>
            <button class="btn" type="submit">Login</button>
        </form>
        <div id="error-message" class="alert alert-danger" style="display: none;"></div>
    </div>

    <script>
        async function login(event) {
            event.preventDefault(); // Prevent form refresh

            const username = document.getElementById('username').value;
            const password = document.getElementById('pass').value;

            try {
                const response = await fetch('http://localhost:9090/login', {  // Correct endpoint (no extra `?`)
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    redirect: "manual" // Prevent automatic redirection
                });

                if (response.status === 302) {
                    const redirectUrl = response.headers.get("Location"); // Get the redirected URL
                    if (redirectUrl) {
                        window.location.href = redirectUrl; // Redirect manually
                    }
                } else if (response.status === 401) {
                    showError("Invalid username or password.");
                } else {
                    showError("An unexpected error occurred. Please try again.");
                }
            } catch (error) {
                showError("Network error. Please check your connection and try again.");
            }
        }

        function showError(message) {
            const errorMessage = document.getElementById("error-message");
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }
    </script>

</body>

</html>
